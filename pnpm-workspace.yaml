packages:
  - "apps/*"
  - "packages/*"
# prisma 7.9.1 still pins deepmerge-ts 7.x (GHSA-ggr8-5vv4-36mx); drop when it ships 8.x
overrides:
  deepmerge-ts@<8.0.0: ^8.0.1
  # prisma 7.10.0 still pins mysql2 3.15.3 (GHSA-3f6p-5ww8-9rcr, GHSA-rgwj-5xj2-c3m3); drop when it ships >=3.23.1
  mysql2@<3.23.1: ^3.23.1
allowBuilds:
  '@prisma/engines': true
  aws-sdk: false
  esbuild: true
  prisma: true
